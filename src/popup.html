<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>ldry-scrtry 설정</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>ldry-scrtry 설정</h1>
  <p class="who">정부24·행정안전부와 관계없는 비공식 길잡이예요.</p>

  <section>
    <h2>서버 연결</h2>
    <p id="relayState" aria-live="polite">아래 버튼으로 확인해 보세요.</p>
    <button type="button" id="test" class="primary">연결 확인</button>
    <p class="hint">길잡이는 화면의 버튼·칸 이름을 서버(싱가포르)로 보내 다음에 누를 곳을 물어봐요. 키는 서버에만 있고 이 확장에는 없어요.</p>
  </section>

  <section>
    <h2>동의</h2>
    <p id="consentState" aria-live="polite">확인 중…</p>
    <button type="button" id="revoke">동의 취소하기</button>
  </section>

  <section>
    <h2>안내 상태</h2>
    <p id="guideState">확인 중…</p>
    <p id="pressed" class="hint"></p>
    <button type="button" id="stop">안내 끝내기</button>
  </section>

  <section>
    <h2>최근 판단 (시험 기록)</h2>
    <ol id="log" class="log"></ol>
    <div class="stack">
      <button type="button" id="copyLast">마지막 화면 정보 복사하기</button>
      <button type="button" id="logClear">기록 지우기</button>
    </div>
    <p id="copyState" class="hint" aria-live="polite">시험 자료를 만들 때 써요. 서버로 보낸 것과 같은, 걸러진 정보만 복사해요.</p>
  </section>

  <script src="popup.js" type="module"></script>
</body>
</html>
